services:
  - type: web
    name: vera-guard
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter            # persistent disks need a paid plan; the free plan works for demos (timers reset on redeploy)
    healthCheckPath: /health
    disk:
      name: vera-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PUBLIC_URL
        sync: false          # e.g. https://vera-guard.onrender.com
      - key: APK_URL
        sync: false          # GitHub release asset URL of VERA-Guard.apk
      - key: LLM_API_KEY
        sync: false
      - key: TWILIO_SID
        sync: false
      - key: TWILIO_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
